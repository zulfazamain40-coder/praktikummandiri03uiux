<!DOCTYPE html>
<html>
<head>
    <title>Aside</title>

    <style>
        body{
            background-color: #666;
        }
        /* MULTIMEDIA */
        .media-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 15px;
            margin-top: 40px;
            align-items: start;
        }

        .media-box {
            border: 1px solid #222;
            padding: 10px;
            min-width: 0;
            background-color: #444;
        }

        .media-box h3 {
            margin-top: 0;
            font-size: 17px;
        }

        video {
            width: 50%;
            height:140px;
            width: 140px;
            
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 1px solid #222;
        }

        .attachments ul {
            padding-left: 20px;
            line-height: 2;
        }

        .attachments a {
            color: #999;
        }

    </style>
</head>

<body>
    <!-- MULTIMEDIA DAN LAMPIRAN -->
            <section class="media-section" id="media">

                    </video>
                </div>

                </div>

                <!-- LAMPIRAN -->

</html>
